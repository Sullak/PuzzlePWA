<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Puzzle Master Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #bb86fc;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
            position: absolute;
            top: 0; left: 0;
        }
        .screen.active { display: flex; }

        h1 { font-size: 2rem; margin-bottom: 15px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        .card {
            background: var(--surface-color);
            padding: 20px;
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        label { font-size: 0.85rem; color: #aaa; font-weight: bold; }
        select, input[type="file"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: transform 0.1s;
            text-align: center;
        }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: #333; color: #fff; }
        .btn-success { background: #4caf50; color: #fff; }

        .preview-box-container {
            width: 100%;
            max-width: 260px;
            aspect-ratio: 1/1;
            position: relative;
            margin: 5px auto;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            background: #000;
        }

        #preview-img, #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0;
        }
        #webcam { display: none; transform: scaleX(-1); }

        /* ÁREA DE JUEGO ULTRA-ESTABLE */
        #game-header {
            width: 100%;
            position: absolute;
            top: 0; left: 0;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            z-index: 10000;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background: #131315;
            touch-action: none;
        }

        /* Optimizado a 2000px para eliminar parpadeos por completo */
        #pan-zoom-canvas {
            position: absolute;
            width: 2000px;
            height: 2000px;
            top: 0; left: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1.5px, transparent 0);
            background-size: 30px 30px;
            transform-origin: 0 0;
            will-change: transform;
            transform: translate3d(0,0,0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .puzzle-piece {
            position: absolute;
            cursor: grab;
            touch-action: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.25);
            will-change: top, left;
            transform: translate3d(0,0,0);
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        .puzzle-piece:active { cursor: grabbing; z-index: 99999 !important; }

        @keyframes flash-union {
            0% { filter: brightness(1); box-shadow: 0 0 0px var(--accent-color); }
            50% { filter: brightness(1.4); box-shadow: 0 0 20px var(--accent-color); }
            100% { filter: brightness(1); box-shadow: 0 4px 8px rgba(0,0,0,0.4); }
        }
        .flash-active { animation: flash-union 0.3s ease-out; }

        #victory-layer {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100000;
        }

        #zoom-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            pointer-events: none;
            color: #eee;
            z-index: 10000;
            text-align: center;
            width: 90%;
            max-width: 380px;
        }
    </style>
</head>
<body>

    <div id="screen-menu" class="screen active">
        <h1>Puzzle Master Pro</h1>
        <div class="card">
            
            <div class="control-group">
                <label>Modo de Juego</label>
                <select id="cfg-mode">
                    <option value="libre" selected>Lienzo Libre (Clásico)</option>
                    <option value="intercambio">Intercambio Fijo (Estilo Solitario)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Dificultad (Cuadrícula)</label>
                <select id="cfg-size">
                    <option value="3">3 x 3 (Fácil)</option>
                    <option value="4" selected>4 x 4 (Medio)</option>
                    <option value="5">5 x 5 (Difícil)</option>
                    <option value="8">8 x 8 (Experto)</option>
                </select>
            </div>
            
            <button id="btn-source-api" class="btn">Imagen Online Aleatoria 🔄</button>
            <input type="file" id="btn-source-file" accept="image/*">
            <button id="btn-source-cam" class="btn btn-secondary">Usar Cámara 📸</button>
            <button id="btn-snap" class="btn" style="background:#ff9800; color:#000; display:none;">¡Capturar Foto! 🎯</button>

            <div class="preview-box-container">
                <img id="preview-img" src="https://picsum.photos/600/600" alt="Preview">
                <video id="webcam" autoplay playsinline></video>
            </div>

            <button id="btn-preview-start" class="btn btn-success">¡Comenzar Desafío!</button>
        </div>
    </div>

    <div id="screen-game" class="screen" style="padding:0;">
        <div id="game-header">
            <button id="btn-game-quit" class="btn btn-secondary" style="padding:8px 12px;">✕ Salir</button>
            <div id="game-stats" style="font-weight:bold; background:rgba(0,0,0,0.5); padding:5px 10px; border-radius:20px;">
                ⏱️ <span id="txt-time">00:00</span> | 🔄 <span id="txt-moves">0</span>
            </div>
        </div>
        
        <div id="viewport">
            <div id="pan-zoom-canvas"></div>
        </div>

        <div id="zoom-indicator">Cargando modo...</div>
    </div>

    <div id="victory-layer">
        <h2 style="color:#4caf50; font-size:3rem; margin-bottom:10px;">¡Completado!</h2>
        <p id="txt-victory-stats" style="margin-bottom:25px;"></p>
        <button id="btn-victory-close" class="btn" style="width:200px;">Volver al Menú</button>
    </div>

    <script>
        const state = {
            mode: 'libre', // 'libre' o 'intercambio'
            size: 4,
            imgSrc: 'https://picsum.photos/600/600',
            pieces: [], 
            groups: [],
            moves: 0,
            startTime: null,
            timerInterval: null,
            zoom: 1,
            panX: 0,
            panY: 0,
            streamObject: null
        };

        const canvas = document.getElementById('pan-zoom-canvas');
        const viewport = document.getElementById('viewport');
        const video = document.getElementById('webcam');
        const previewImg = document.getElementById('preview-img');
        const zoomIndicator = document.getElementById('zoom-indicator');

        document.addEventListener('DOMContentLoaded', () => {
            setupMenuEvents();
            setupAdvancedGestures();
        });

        function setupMenuEvents() {
            document.getElementById('btn-source-api').addEventListener('click', () => {
                closeWebcam();
                state.imgSrc = `https://picsum.photos/800/800?sig=${Math.floor(Math.random()*1000)}`;
                previewImg.src = state.imgSrc;
            });

            document.getElementById('btn-source-file').addEventListener('change', (e) => {
                if(e.target.files[0]) {
                    closeWebcam();
                    state.imgSrc = URL.createObjectURL(e.target.files[0]);
                    previewImg.src = state.imgSrc;
                }
            });

            document.getElementById('btn-source-cam').addEventListener('click', async () => {
                try {
                    state.streamObject = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "environment", width: 600, height: 600 } 
                    });
                    video.srcObject = state.streamObject;
                    previewImg.style.display = 'none';
                    video.style.display = 'block';
                    document.getElementById('btn-snap').style.display = 'block';
                } catch(e) { 
                    alert("Por favor, asegúrate de dar permisos a la cámara."); 
                }
            });

            document.getElementById('btn-snap').addEventListener('click', () => {
                if (!state.streamObject) return;
                const canvasSnap = document.createElement('canvas');
                canvasSnap.width = 600; canvasSnap.height = 600;
                const ctx = canvasSnap.getContext('2d');
                const min = Math.min(video.videoWidth, video.videoHeight);
                ctx.translate(600, 0); ctx.scale(-1, 1);
                ctx.drawImage(video, (video.videoWidth-min)/2, (video.videoHeight-min)/2, min, min, 0, 0, 600, 600);
                
                state.imgSrc = canvasSnap.toDataURL('image/jpeg');
                previewImg.src = state.imgSrc;
                closeWebcam();
            });

            document.getElementById('btn-preview-start').addEventListener('click', initGameplay);
            document.getElementById('btn-game-quit').addEventListener('click', () => {
                stopTimer();
                if(document.exitFullscreen) document.exitFullscreen().catch(()=>{});
                showMenu();
            });
            document.getElementById('btn-victory-close').addEventListener('click', () => {
                document.getElementById('victory-layer').style.display = 'none';
                showMenu();
            });
        }

        function showMenu() {
            document.getElementById('screen-menu').classList.add('active');
            document.getElementById('screen-game').classList.remove('active');
        }

        function closeWebcam() {
            if (state.streamObject) {
                state.streamObject.getTracks().forEach(track => track.stop());
                state.streamObject = null;
            }
            video.style.display = 'none';
            previewImg.style.display = 'block';
            document.getElementById('btn-snap').style.display = 'none';
        }

        function setupAdvancedGestures() {
            let activePointers = {}; 
            let isDraggingBg = false;
            let startPanX = 0, startPanY = 0;
            let startTouchX = 0, startTouchY = 0;
            let startPinchDist = 0;
            let startZoom = 1;

            viewport.addEventListener('wheel', (e) => {
                if (state.mode === 'intercambio') return; // Bloquear zoom en modo intercambio
                e.preventDefault();
                const zoomFactor = state.zoom * 0.15;
                let nextZoom = e.deltaY < 0 ? state.zoom + zoomFactor : state.zoom - zoomFactor;
                nextZoom = Math.max(0.1, Math.min(nextZoom, 3));
                
                const rect = viewport.getBoundingClientRect();
                state.panX = (e.clientX - rect.left) - ((e.clientX - rect.left) - state.panX) * (nextZoom / state.zoom);
                state.panY = (e.clientY - rect.top) - ((e.clientY - rect.top) - state.panY) * (nextZoom / state.zoom);
                state.zoom = nextZoom;
                updateCanvasTransform();
            }, { passive: false });

            viewport.addEventListener('pointerdown', (e) => {
                activePointers[e.pointerId] = e;
                const pointerCount = Object.keys(activePointers).length;

                if ((e.target === viewport || e.target === canvas) && state.mode === 'libre') {
                    if (pointerCount === 1) {
                        isDraggingBg = true;
                        startPanX = state.panX; startPanY = state.panY;
                        startTouchX = e.clientX; startTouchY = e.clientY;
                    }
                }

                if (pointerCount === 2 && state.mode === 'libre') {
                    isDraggingBg = false; 
                    const pointers = Object.values(activePointers);
                    startPinchDist = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY);
                    startZoom = state.zoom;
                    startTouchX = (pointers[0].clientX + pointers[1].clientX) / 2;
                    startTouchY = (pointers[0].clientY + pointers[1].clientY) / 2;
                    startPanX = state.panX; startPanY = state.panY;
                }
            });

            viewport.addEventListener('pointermove', (e) => {
                if (!activePointers[e.pointerId] || state.mode === 'intercambio') return;
                activePointers[e.pointerId] = e; 
                
                const pointers = Object.values(activePointers);
                const pointerCount = pointers.length;

                if (isDraggingBg && pointerCount === 1) {
                    state.panX = startPanX + (e.clientX - startTouchX);
                    state.panY = startPanY + (e.clientY - startTouchY);
                    updateCanvasTransform();
                }

                if (pointerCount === 2) {
                    const currentDist = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY);
                    let nextZoom = startZoom * (currentDist / startPinchDist);
                    nextZoom = Math.max(0.1, Math.min(nextZoom, 3));

                    const midX = (pointers[0].clientX + pointers[1].clientX) / 2;
                    const midY = (pointers[0].clientY + pointers[1].clientY) / 2;

                    state.panX = midX - (midX - startPanX) * (nextZoom / startZoom);
                    state.panY = midY - (midY - startPanY) * (nextZoom / startZoom);
                    state.zoom = nextZoom;
                    updateCanvasTransform();
                }
            });

            const removePointer = (e) => {
                delete activePointers[e.pointerId];
                if (Object.keys(activePointers).length < 1) isDraggingBg = false;
            };
            viewport.addEventListener('pointerup', removePointer);
            viewport.addEventListener('pointercancel', removePointer);
            viewport.addEventListener('pointerleave', removePointer);
        }

        function updateCanvasTransform() {
            canvas.style.transform = `translate3d(${state.panX}px, ${state.panY}px, 0) scale(${state.zoom})`;
        }

        function initGameplay() {
            closeWebcam();
            state.size = parseInt(document.getElementById('cfg-size').value);
            state.mode = document.getElementById('cfg-mode').value;
            state.moves = 0;
            document.getElementById('txt-moves').textContent = "0";
            
            if (state.mode === 'libre') {
                zoomIndicator.innerHTML = "Lienzo Libre: Un dedo mueve fondo/piezas | Dos dedos controlan Zoom";
                state.zoom = 0.6;
                state.panX = (window.innerWidth - (2000 * state.zoom)) / 2;
                state.panY = (window.innerHeight - (600 * state.zoom)) / 3;
            } else {
                zoomIndicator.innerHTML = "Modo Intercambio: Arrastra una pieza sobre otra para permutarlas";
                // Centrado matemático perfecto del tablero fijo
                state.zoom = Math.min(window.innerWidth / 620, window.innerHeight / 720, 1);
                state.panX = (window.innerWidth - (600 * state.zoom)) / 2;
                state.panY = (window.innerHeight - (600 * state.zoom)) / 2 + 30;
            }
            updateCanvasTransform();
            
            const docEl = document.documentElement;
            if(docEl.requestFullscreen) docEl.requestFullscreen().catch(()=>{});

            document.getElementById('screen-menu').classList.remove('active');
            document.getElementById('screen-game').classList.add('active');
            
            buildPuzzleBoard();
            startTimer();
        }

        function buildPuzzleBoard() {
            canvas.innerHTML = '';
            const boardSize = 600; 
            const pSize = boardSize / state.size;
            
            // Si es libre usa el centro del lienzo de 2000px, si es intercambio empieza en (0,0) del canvas
            const offsetX = state.mode === 'libre' ? (2000 - boardSize) / 2 : 0;
            const offsetY = state.mode === 'libre' ? (2000 - boardSize) / 2 : 0;

            state.pieces = [];
            state.groups = [];

            // 1. Crear piezas en sus posiciones objetivo correctas
            let index = 0;
            for(let r=0; r<state.size; r++) {
                for(let c=0; c<state.size; c++) {
                    const piece = document.createElement('div');
                    piece.classList.add('puzzle-piece');
                    piece.style.width = `${pSize}px`;
                    piece.style.height = `${pSize}px`;
                    piece.style.backgroundImage = `url(${state.imgSrc})`;
                    piece.style.backgroundSize = `${boardSize}px ${boardSize}px`;
                    piece.style.backgroundPosition = `-${c * pSize}px -${r * pSize}px`;
                    
                    const targetX = offsetX + (c * pSize);
                    const targetY = offsetY + (r * pSize);

                    state.pieces.push({
                        el: piece, id: index,
                        r: r, c: c,
                        tx: targetX, ty: targetY,
                        x: targetX, y: targetY // Inicialmente asignados aquí
                    });
                    state.groups.push([index]);
                    index++;
                }
            }

            // 2. Dispersar/Barajar según el modo de juego elegido
            if (state.mode === 'libre') {
                // CORRECCIÓN: Gran grupo único y aleatorio alrededor del tablero central
                state.pieces.forEach(p => {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 350 + Math.random() * 300; 
                    p.x = offsetX + (boardSize / 2) + Math.cos(angle) * distance - (pSize / 2);
                    p.y = offsetY + (boardSize / 2) + Math.sin(angle) * distance - (pSize / 2);
                    
                    p.el.style.left = `${p.x}px`;
                    p.el.style.top = `${p.y}px`;
                    canvas.appendChild(p.el);
                });
            } else {
                // Modo Intercambio: Posiciones de rejilla ordenadas pero con IDs de piezas totalmente mezcladas
                const gridPositions = state.pieces.map(p => ({ x: p.tx, y: p.ty }));
                // Algoritmo de barajado Fisher-Yates
                for (let i = gridPositions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [gridPositions[i], gridPositions[j]] = [gridPositions[j], gridPositions[i]];
                }
                state.pieces.forEach((p, i) => {
                    p.x = gridPositions[i].x;
                    p.y = gridPositions[i].y;
                    p.el.style.left = `${p.x}px`;
                    p.el.style.top = `${p.y}px`;
                    canvas.appendChild(p.el);
                });
            }

            state.pieces.forEach(p => {
                p.el.addEventListener('pointerdown', (e) => onPiecePointerDown(e, p));
            });
        }

        function onPiecePointerDown(e, clickedPiece) {
            e.stopPropagation();
            e.preventDefault();
            
            const groupIdx = state.groups.findIndex(g => g.includes(clickedPiece.id));
            const groupIds = state.groups[groupIdx];

            // Traer bloque adelante
            groupIds.forEach(id => canvas.appendChild(state.pieces[id].el));

            const startX = e.clientX;
            const startY = e.clientY;
            const initialPos = groupIds.map(id => ({ id: id, x: state.pieces[id].x, y: state.pieces[id].y }));

            function onPointerMove(ev) {
                const dx = (ev.clientX - startX) / state.zoom;
                const dy = (ev.clientY - startY) / state.zoom;

                groupIds.forEach((id, idx) => {
                    const piece = state.pieces[id];
                    piece.el.style.left = `${initialPos[idx].x + dx}px`;
                    piece.el.style.top = `${initialPos[idx].y + dy}px`;
                });
            }

            function onPointerUp(ev) {
                window.removeEventListener('pointermove', onPointerMove);
                window.removeEventListener('pointerup', onPointerUp);

                state.moves++;
                document.getElementById('txt-moves').textContent = state.moves;

                if (state.mode === 'libre') {
                    // Guardar posiciones finales arrastradas
                    groupIds.forEach(id => {
                        state.pieces[id].x = parseFloat(state.pieces[id].el.style.left);
                        state.pieces[id].y = parseFloat(state.pieces[id].el.style.top);
                    });
                    checkGroupUnions(groupIdx);
                } else {
                    // MÓDULO DE INTERCAMBIO (SWAP)
                    // Detectar qué pieza/bloque está debajo del dedo al soltar
                    const releaseX = ev.clientX;
                    const releaseY = ev.clientY;
                    
                    let targetPiece = null;
                    // Buscar la pieza más cercana al punto de liberación que NO pertenezca al grupo que movemos
                    for (let p of state.pieces) {
                        if (groupIds.includes(p.id)) continue;
                        const rect = p.el.getBoundingClientRect();
                        if (releaseX >= rect.left && releaseX <= rect.right && releaseY >= rect.top && releaseY <= rect.bottom) {
                            targetPiece = p;
                            break;
                        }
                    }

                    if (targetPiece) {
                        // Encontrar el grupo completo de la pieza destino
                        const targetGroupIdx = state.groups.findIndex(g => g.includes(targetPiece.id));
                        const targetGroupIds = state.groups[targetGroupIdx];

                        // Calcular vectores de desplazamiento mutuo entre bloques
                        const sourceCenterX = clickedPiece.x;
                        const sourceCenterY = clickedPiece.y;
                        const targetCenterX = targetPiece.x;
                        const targetCenterY = targetPiece.y;

                        const shiftX = targetCenterX - sourceCenterX;
                        const shiftY = targetCenterY - sourceCenterY;

                        // Mover piezas de origen a destino
                        groupIds.forEach(id => {
                            state.pieces[id].x += shiftX;
                            state.pieces[id].y += shiftY;
                            state.pieces[id].el.style.left = `${state.pieces[id].x}px`;
                            state.pieces[id].el.style.top = `${state.pieces[id].y}px`;
                        });

                        // Mover piezas de destino a origen
                        targetGroupIds.forEach(id => {
                            state.pieces[id].x -= shiftX;
                            state.pieces[id].y -= shiftY;
                            state.pieces[id].el.style.left = `${state.pieces[id].x}px`;
                            state.pieces[id].el.style.top = `${state.pieces[id].y}px`;
                        });

                        // Verificar uniones para ambos bloques permutados
                        checkGroupUnions(state.groups.findIndex(g => g.includes(clickedPiece.id)));
                        checkGroupUnions(state.groups.findIndex(g => g.includes(targetPiece.id)));
                    } else {
                        // Si se suelta en la nada, regresar el bloque a su lugar de origen
                        groupIds.forEach(id => {
                            state.pieces[id].el.style.left = `${state.pieces[id].x}px`;
                            state.pieces[id].el.style.top = `${state.pieces[id].y}px`;
                        });
                    }
                }
            }

            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
        }

        function checkGroupUnions(currentGroupIdx) {
            if (currentGroupIdx === -1) return;
            const currentGroup = state.groups[currentGroupIdx];
            if (!currentGroup) return;
            
            // Tolerancia ajustada: estricta en intercambio, flexible en libre
            const tolerance = state.mode === 'libre' ? 24 : 5; 
            let unionFound = false;

            for (let i = 0; i < state.groups.length; i++) {
                if (i === currentGroupIdx) continue;
                const otherGroup = state.groups[i];

                for (let pId1 of currentGroup) {
                    for (let pId2 of otherGroup) {
                        const p1 = state.pieces[pId1];
                        const p2 = state.pieces[pId2];

                        const isHorizontalNeighbor = (Math.abs(p1.c - p2.c) === 1 && p1.r === p2.r);
                        const isVerticalNeighbor = (Math.abs(p1.r - p2.r) === 1 && p1.c === p2.c);

                        if (!isHorizontalNeighbor && !isVerticalNeighbor) continue;

                        const expectedDx = (p1.c - p2.c) * p1.el.offsetWidth;
                        const expectedDy = (p1.r - p2.r) * p1.el.offsetHeight;
                        const currentDx = p1.x - p2.x;
                        const currentDy = p1.y - p2.y;

                        if (Math.abs(currentDx - expectedDx) < tolerance && Math.abs(currentDy - expectedDy) < tolerance) {
                            
                            const shiftX = p2.x + expectedDx - p1.x;
                            const shiftY = p2.y + expectedDy - p1.y;

                            currentGroup.forEach(id => {
                                state.pieces[id].x += shiftX;
                                state.pieces[id].y += shiftY;
                                state.pieces[id].el.style.left = `${state.pieces[id].x}px`;
                                state.pieces[id].el.style.top = `${state.pieces[id].y}px`;
                            });

                            state.groups[i] = otherGroup.concat(currentGroup);
                            state.groups.splice(currentGroupIdx, 1);
                            unionFound = true;
                            break;
                        }
                    }
                    if (unionFound) break;
                }
                if (unionFound) break;
            }

            if (unionFound) {
                const finalGroup = state.groups.find(g => g.includes(currentGroup[0]));
                finalGroup.forEach(id => {
                    const el = state.pieces[id].el;
                    el.classList.remove('flash-active');
                    void el.offsetWidth; 
                    el.classList.add('flash-active');
                });
                hideInternalBorders(finalGroup);
            }

            // En modo libre, ajustar a las coordenadas meta finales del tablero
            if (state.mode === 'libre') {
                const activeGroupIdx = state.groups.findIndex(g => g.includes(currentGroup[0]));
                if (activeGroupIdx !== -1) {
                    const activeGroup = state.groups[activeGroupIdx];
                    const checkPiece = state.pieces[activeGroup[0]];
                    const distToTarget = Math.hypot(checkPiece.x - checkPiece.tx, checkPiece.y - checkPiece.ty);
                    
                    if(distToTarget < tolerance) {
                        const shiftX = checkPiece.tx - checkPiece.x;
                        const shiftY = checkPiece.ty - checkPiece.y;

                        activeGroup.forEach(id => {
                            const p = state.pieces[id];
                            p.x += shiftX; p.y += shiftY;
                            p.el.style.left = `${p.tx}px`;
                            p.el.style.top = `${p.ty}px`;
                            p.el.style.boxShadow = "none";
                            p.el.style.border = "none"; 
                        });
                    }
                }
            }

            // CONDICIÓN DE VICTORIA TOTAL
            if (state.groups.length === 1) {
                // En modo intercambio, asegurar que el bloque completo esté en el origen correcto
                if (state.mode === 'intercambio') {
                    const p = state.pieces[0];
                    if (p.x !== p.tx || p.y !== p.ty) return; // Debe estar ordenado correctamente
                }
                
                stopTimer();
                setTimeout(() => {
                    if(document.exitFullscreen) document.exitFullscreen().catch(()=>{});
                    document.getElementById('txt-victory-stats').innerText = `Tiempo: ${document.getElementById('txt-time').innerText} | Movimientos totales: ${state.moves}`;
                    document.getElementById('victory-layer').style.display = 'flex';
                }, 500);
            }
        }

        function hideInternalBorders(groupIds) {
            groupIds.forEach(id1 => {
                const p1 = state.pieces[id1];
                let topMatch = false, bottomMatch = false, leftMatch = false, rightMatch = false;

                groupIds.forEach(id2 => {
                    const p2 = state.pieces[id2];
                    if (p1.c === p2.c && p1.r - 1 === p2.r) topMatch = true;
                    if (p1.c === p2.c && p1.r + 1 === p2.r) bottomMatch = true;
                    if (p1.r === p2.r && p1.c - 1 === p2.c) leftMatch = true;
                    if (p1.r === p2.r && p1.c + 1 === p2.c) rightMatch = true;
                });

                p1.el.style.borderTop = topMatch ? "1px solid transparent" : "1px solid rgba(255,255,255,0.25)";
                p1.el.style.borderBottom = bottomMatch ? "1px solid transparent" : "1px solid rgba(255,255,255,0.25)";
                p1.el.style.borderLeft = leftMatch ? "1px solid transparent" : "1px solid rgba(255,255,255,0.25)";
                p1.el.style.borderRight = rightMatch ? "1px solid transparent" : "1px solid rgba(255,255,255,0.25)";
            });
        }

        function startTimer() {
            stopTimer();
            state.startTime = Date.now();
            state.timerInterval = setInterval(() => {
                const diff = Date.now() - state.startTime;
                const mins = Math.floor(diff / 60000).toString().padStart(2, '0');
                const secs = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                document.getElementById('txt-time').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            if(state.timerInterval) clearInterval(state.timerInterval);
        }
    </script>
</body>
