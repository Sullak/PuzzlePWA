<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Puzzle Master Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #bb86fc;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
            position: absolute;
            top: 0; left: 0;
        }
        .screen.active { display: flex; }

        h1 { font-size: 2.2rem; margin-bottom: 30px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { font-size: 1.5rem; margin-bottom: 15px; }

        .card {
            background: var(--surface-color);
            padding: 25px;
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label { font-size: 0.9rem; color: #aaa; }
        select, input[type="file"] {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.1s;
            text-align: center;
        }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: #333; color: #fff; }

        #preview-img {
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        /* ÁREA DE JUEGO */
        #game-header {
            width: 100%;
            position: absolute;
            top: 0; left: 0;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 100;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background: #141416;
            touch-action: none; /* Bloquea gestos nativos del navegador */
        }

        #pan-zoom-canvas {
            position: absolute;
            width: 3000px;
            height: 3000px;
            top: 0;
            left: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1.5px, transparent 0);
            background-size: 30px 30px;
            transform-origin: 0 0; /* Cambio crítico para transformaciones matemáticas estables */
            will-change: transform;
        }

        .puzzle-piece {
            position: absolute;
            cursor: grab;
            touch-action: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            outline: 1px solid rgba(255,255,255,0.15);
            outline-offset: -1px;
        }
        .puzzle-piece:active { cursor: grabbing; z-index: 9999 !important; }

        @keyframes flash-union {
            0% { filter: brightness(1); box-shadow: 0 0 0px var(--accent-color); }
            50% { filter: brightness(1.5); box-shadow: 0 0 25px var(--accent-color); }
            100% { filter: brightness(1); box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        }
        .flash-active {
            animation: flash-union 0.35s ease-out;
        }

        #victory-layer {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        #zoom-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            pointer-events: none;
            color: #ccc;
            z-index: 100;
            text-align: center;
            width: 90%;
            max-width: 360px;
        }
    </style>
</head>
<body>

    <div id="screen-menu" class="screen active">
        <h1>Puzzle Master Pro</h1>
        <div class="card">
            <div class="control-group">
                <label>Dificultad</label>
                <select id="cfg-size">
                    <option value="3">3 x 3 (Fácil)</option>
                    <option value="4" selected>4 x 4 (Medio)</option>
                    <option value="5">5 x 5 (Difícil)</option>
                    <option value="8">8 x 8 (Experto)</option>
                </select>
            </div>
            <button id="btn-source-api" class="btn">Buscar Imagen Online</button>
            <input type="file" id="btn-source-file" accept="image/*">
            <button id="btn-source-cam" class="btn btn-secondary">Tomar Foto 📸</button>
        </div>
    </div>

    <div id="screen-preview" class="screen">
        <h2>Vista Previa del Desafío</h2>
        <img id="preview-img" src="" alt="Preview">
        <div style="display:flex; gap:10px; width:100%; max-width:300px;">
            <button id="btn-preview-back" class="btn btn-secondary" style="flex:1;">Atrás</button>
            <button id="btn-preview-start" class="btn" style="flex:2; background:#4caf50; color:#fff;">¡Comenzar!</button>
        </div>
    </div>

    <div id="screen-game" class="screen" style="padding:0;">
        <div id="game-header">
            <button id="btn-game-quit" class="btn btn-secondary" style="padding:8px 12px;">✕ Salir</button>
            <div id="game-stats" style="font-weight:bold; background:rgba(0,0,0,0.5); padding:5px 10px; border-radius:20px;">
                ⏱️ <span id="txt-time">00:00</span> | 🔄 <span id="txt-moves">0</span>
            </div>
        </div>
        
        <div id="viewport">
            <div id="pan-zoom-canvas"></div>
        </div>

        <div id="zoom-indicator">Usa dos dedos (pinch) para Zoom | Un dedo para mover fondo o piezas</div>
    </div>

    <div id="victory-layer">
        <h2 style="color:#4caf50; font-size:3rem; margin-bottom:10px;">¡Completado!</h2>
        <p id="txt-victory-stats" style="margin-bottom:25px;"></p>
        <button id="btn-victory-close" class="btn" style="width:200px;">Volver al Menú</button>
    </div>

    <video id="webcam" style="display:none;" autoplay playsinline></video>

    <script>
        const state = {
            size: 4,
            imgSrc: 'https://picsum.photos/600/600',
            pieces: [], 
            groups: [],
            moves: 0,
            startTime: null,
            timerInterval: null,
            // Coordenadas de la cámara/lienzo
            zoom: 1,
            panX: 0,
            panY: 0
        };

        const canvas = document.getElementById('pan-zoom-canvas');
        const viewport = document.getElementById('viewport');

        document.addEventListener('DOMContentLoaded', () => {
            setupMenuEvents();
            setupAdvancedGestures();
        });

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function setupMenuEvents() {
            document.getElementById('btn-source-api').addEventListener('click', () => {
                state.imgSrc = `https://picsum.photos/800/800?sig=${Math.floor(Math.random()*1000)}`;
                openPreview();
            });

            document.getElementById('btn-source-file').addEventListener('change', (e) => {
                if(e.target.files[0]) {
                    state.imgSrc = URL.createObjectURL(e.target.files[0]);
                    openPreview();
                }
            });

            document.getElementById('btn-source-cam').addEventListener('click', async () => {
                try {
                    const video = document.getElementById('webcam');
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    video.srcObject = stream;
                    setTimeout(() => {
                        const canvasSnap = document.createElement('canvas');
                        canvasSnap.width = 600; canvasSnap.height = 600;
                        const ctx = canvasSnap.getContext('2d');
                        const min = Math.min(video.videoWidth, video.videoHeight);
                        ctx.drawImage(video, (video.videoWidth-min)/2, (video.videoHeight-min)/2, min, min, 0, 0, 600, 600);
                        state.imgSrc = canvasSnap.toDataURL('image/jpeg');
                        stream.getTracks().forEach(t => t.stop());
                        openPreview();
                    }, 1000);
                } catch(e) { alert("Cámara no disponible"); }
            });

            document.getElementById('btn-preview-back').addEventListener('click', () => showScreen('screen-menu'));
            document.getElementById('btn-preview-start').addEventListener('click', initGameplay);
            document.getElementById('btn-game-quit').addEventListener('click', () => {
                stopTimer();
                if(document.exitFullscreen) document.exitFullscreen().catch(()=>{});
                showScreen('screen-menu');
            });
            document.getElementById('btn-victory-close').addEventListener('click', () => {
                document.getElementById('victory-layer').style.display = 'none';
                showScreen('screen-menu');
            });
        }

        function openPreview() {
            document.getElementById('preview-img').src = state.imgSrc;
            showScreen('screen-preview');
        }

        // MOTOR RECONOCEDOR DE GESTOS AVANZADOS (PINCH ZOOM & MULTITOUCH PAN)
        function setupAdvancedGestures() {
            let activePointers = {}; // Registro de dedos tocando la pantalla
            let isDraggingBg = false;
            let startPanX = 0, startPanY = 0;
            let startTouchX = 0, startTouchY = 0;
            let startPinchDist = 0;
            let startZoom = 1;

            // --- Soporte de Escritorio (Rueda del ratón) ---
            viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = 0.08;
                let nextZoom = e.deltaY < 0 ? state.zoom + zoomFactor : state.zoom - zoomFactor;
                nextZoom = Math.max(0.3, Math.min(nextZoom, 3));
                
                // Centrar zoom en el puntero del ratón
                const rect = viewport.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;
                
                state.panX = mouseX - (mouseX - state.panX) * (nextZoom / state.zoom);
                state.panY = mouseY - (mouseY - state.panY) * (nextZoom / state.zoom);
                state.zoom = nextZoom;
                
                updateCanvasTransform();
            }, { passive: false });

            // --- Motor Unificado de Punteros (Móvil + Mouse) ---
            viewport.addEventListener('pointerdown', (e) => {
                activePointers[e.pointerId] = e;
                const pointerCount = Object.keys(activePointers).length;

                // Si pulsamos en el fondo vacío o el canvas puro, arrastramos el mapa
                if (e.target === viewport || e.target === canvas) {
                    if (pointerCount === 1) {
                        isDraggingBg = true;
                        startPanX = state.panX;
                        startPanY = state.panY;
                        startTouchX = e.clientX;
                        startTouchY = e.clientY;
                    }
                }

                // Configuración inicial de Pinch Zoom al meter el segundo dedo
                if (pointerCount === 2) {
                    isDraggingBg = false; // Cancelamos arrastre simple
                    const pointers = Object.values(activePointers);
                    startPinchDist = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY);
                    startZoom = state.zoom;
                    
                    // Guardar el centro del pinch para hacer zoom centrado entre los dos dedos
                    startTouchX = (pointers[0].clientX + pointers[1].clientX) / 2;
                    startTouchY = (pointers[0].clientY + pointers[1].clientY) / 2;
                    startPanX = state.panX;
                    startPanY = state.panY;
                }
            });

            viewport.addEventListener('pointermove', (e) => {
                if (!activePointers[e.pointerId]) return;
                activePointers[e.pointerId] = e; // Actualizar coordenadas del dedo actual
                
                const pointers = Object.values(activePointers);
                const pointerCount = pointers.length;

                // 1. Paneo fluido continuo con un dedo
                if (isDraggingBg && pointerCount === 1) {
                    const dx = e.clientX - startTouchX;
                    const dy = e.clientY - startTouchY;
                    state.panX = startPanX + dx;
                    state.panY = startPanY + dy;
                    updateCanvasTransform();
                }

                // 2. Pinch to Zoom real con dos dedos geométricos
                if (pointerCount === 2) {
                    const currentDist = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY);
                    const scaleChange = currentDist / startPinchDist;
                    let nextZoom = startZoom * scaleChange;
                    nextZoom = Math.max(0.3, Math.min(nextZoom, 3));

                    const midX = (pointers[0].clientX + pointers[1].clientX) / 2;
                    const midY = (pointers[0].clientY + pointers[1].clientY) / 2;

                    // Ajustar paneo matemático para que la imagen no se desplace de las puntas de los dedos
                    state.panX = midX - (midX - startPanX) * (nextZoom / startZoom);
                    state.panY = midY - (midY - startPanY) * (nextZoom / startZoom);
                    state.zoom = nextZoom;
                    
                    updateCanvasTransform();
                }
            });

            const removePointer = (e) => {
                delete activePointers[e.pointerId];
                if (Object.keys(activePointers).length < 1) {
                    isDraggingBg = false;
                }
            };

            viewport.addEventListener('pointerup', removePointer);
            viewport.addEventListener('pointercancel', removePointer);
            viewport.addEventListener('pointerleave', removePointer);
        }

        function updateCanvasTransform() {
            canvas.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
        }

        // MOTOR DE JUEGO
        function initGameplay() {
            state.size = parseInt(document.getElementById('cfg-size').value);
            state.moves = 0;
            
            // Centrar el lienzo de 3000x3000px en la pantalla del móvil automáticamente al arrancar
            state.zoom = 0.8;
            state.panX = (window.innerWidth - (3000 * state.zoom)) / 2;
            state.panY = (window.innerHeight - (600 * state.zoom)) / 3;
            updateCanvasTransform();
            
            document.getElementById('txt-moves').textContent = "0";
            
            const docEl = document.documentElement;
            if(docEl.requestFullscreen) docEl.requestFullscreen().catch(()=>{});

            showScreen('screen-game');
            buildPuzzleBoard();
            startTimer();
        }

        function buildPuzzleBoard() {
            canvas.innerHTML = '';
            const boardSize = 600; 
            const pSize = boardSize / state.size;
            
            const offsetX = (3000 - boardSize) / 2;
            const offsetY = (3000 - boardSize) / 2;

            state.pieces = [];
            state.groups = [];

            let index = 0;
            for(let r=0; r<state.size; r++) {
                for(let c=0; c<state.size; c++) {
                    const piece = document.createElement('div');
                    piece.classList.add('puzzle-piece');
                    piece.style.width = `${pSize}px`;
                    piece.style.height = `${pSize}px`;
                    piece.style.backgroundImage = `url(${state.imgSrc})`;
                    piece.style.backgroundSize = `${boardSize}px ${boardSize}px`;
                    piece.style.backgroundPosition = `-${c * pSize}px -${r * pSize}px`;
                    
                    const targetX = offsetX + (c * pSize);
                    const targetY = offsetY + (r * pSize);

                    // Dispersión controlada a los costados y abajo del tablero central
                    let randomX, randomY;
                    if(Math.random() > 0.5){
                        randomX = offsetX - 350 + Math.random() * 200;
                    } else {
                        randomX = offsetX + boardSize + 100 + Math.random() * 200;
                    }
                    randomY = offsetY - 100 + Math.random() * (boardSize + 200);
                    
                    piece.style.left = `${randomX}px`;
                    piece.style.top = `${randomY}px`;
                    piece.dataset.id = index;
                    canvas.appendChild(piece);

                    state.pieces.push({
                        el: piece, id: index,
                        r: r, c: c,
                        tx: targetX, ty: targetY,
                        x: randomX, y: randomY
                    });

                    state.groups.push([index]);
                    index++;
                }
            }

            state.pieces.forEach(p => {
                p.el.addEventListener('pointerdown', (e) => onPiecePointerDown(e, p));
            });
        }

        function onPiecePointerDown(e, clickedPiece) {
            e.stopPropagation();
            e.preventDefault();
            
            const groupIdx = state.groups.findIndex(g => g.includes(clickedPiece.id));
            const groupIds = state.groups[groupIdx];

            groupIds.forEach(id => canvas.appendChild(state.pieces[id].el));

            const startX = e.clientX;
            const startY = e.clientY;
            const initialPos = groupIds.map(id => ({ id: id, x: state.pieces[id].x, y: state.pieces[id].y }));

            function onPointerMove(ev) {
                // El arrastre de las piezas ahora respeta perfectamente el nivel de zoom dinámico
                const dx = (ev.clientX - startX) / state.zoom;
                const dy = (ev.clientY - startY) / state.zoom;

                initialPos.forEach(pos => {
                    const piece = state.pieces[pos.id];
                    piece.x = pos.x + dx;
                    piece.y = pos.y + dy;
                    piece.el.style.left = `${piece.x}px`;
                    piece.el.style.top = `${piece.y}px`;
                });
            }

            function onPointerUp() {
                window.removeEventListener('pointermove', onPointerMove);
                window.removeEventListener('pointerup', onPointerUp);

                state.moves++;
                document.getElementById('txt-moves').textContent = state.moves;

                checkGroupUnions(groupIdx);
            }

            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
        }

        function checkGroupUnions(currentGroupIdx) {
            const currentGroup = state.groups[currentGroupIdx];
            const tolerance = 22; 
            let unionFound = false;

            for (let i = 0; i < state.groups.length; i++) {
                if (i === currentGroupIdx) continue;
                const otherGroup = state.groups[i];

                for (let pId1 of currentGroup) {
                    for (let pId2 of otherGroup) {
                        const p1 = state.pieces[pId1];
                        const p2 = state.pieces[pId2];

                        const isHorizontalNeighbor = (Math.abs(p1.c - p2.c) === 1 && p1.r === p2.r);
                        const isVerticalNeighbor = (Math.abs(p1.r - p2.r) === 1 && p1.c === p2.c);

                        if (!isHorizontalNeighbor && !isVerticalNeighbor) continue;

                        const expectedDx = (p1.c - p2.c) * p1.el.offsetWidth;
                        const expectedDy = (p1.r - p2.r) * p1.el.offsetHeight;
                        const currentDx = p1.x - p2.x;
                        const currentDy = p1.y - p2.y;

                        if (Math.abs(currentDx - expectedDx) < tolerance && Math.abs(currentDy - expectedDy) < tolerance) {
                            
                            const shiftX = p2.x + expectedDx - p1.x;
                            const shiftY = p2.y + expectedDy - p1.y;

                            currentGroup.forEach(id => {
                                state.pieces[id].x += shiftX;
                                state.pieces[id].y += shiftY;
                                state.pieces[id].el.style.left = `${state.pieces[id].x}px`;
                                state.pieces[id].el.style.top = `${state.pieces[id].y}px`;
                            });

                            state.groups[i] = otherGroup.concat(currentGroup);
                            state.groups.splice(currentGroupIdx, 1);
                            unionFound = true;
                            break;
                        }
                    }
                    if (unionFound) break;
                }
                if (unionFound) break;
            }

            if (unionFound) {
                const finalGroup = state.groups.find(g => g.includes(currentGroup[0]));
                finalGroup.forEach(id => {
                    const el = state.pieces[id].el;
                    el.classList.remove('flash-active');
                    void el.offsetWidth; 
                    el.classList.add('flash-active');
                });
                hideInternalBorders(finalGroup);
            }

            const activeGroupIdx = state.groups.findIndex(g => g.includes(currentGroup[0]));
            const activeGroup = state.groups[activeGroupIdx];
            const checkPiece = state.pieces[activeGroup[0]];
            const distToTarget = Math.hypot(checkPiece.x - checkPiece.tx, checkPiece.y - checkPiece.ty);
            
            if(distToTarget < tolerance) {
                const shiftX = checkPiece.tx - checkPiece.x;
                const shiftY = checkPiece.ty - checkPiece.y;

                activeGroup.forEach(id => {
                    const p = state.pieces[id];
                    p.x += shiftX; p.y += shiftY;
                    p.el.style.left = `${p.tx}px`;
                    p.el.style.top = `${p.ty}px`;
                    p.el.style.boxShadow = "none";
                    p.el.style.outline = "none"; 
                });
            }

            if (state.groups.length === 1) {
                stopTimer();
                setTimeout(() => {
                    if(document.exitFullscreen) document.exitFullscreen().catch(()=>{});
                    document.getElementById('txt-victory-stats').innerText = `Tiempo total: ${document.getElementById('txt-time').innerText} | Movimientos: ${state.moves}`;
                    document.getElementById('victory-layer').style.display = 'flex';
                }, 600);
            }
        }

        function hideInternalBorders(groupIds) {
            groupIds.forEach(id1 => {
                const p1 = state.pieces[id1];
                let topMatch = false, bottomMatch = false, leftMatch = false, rightMatch = false;

                groupIds.forEach(id2 => {
                    const p2 = state.pieces[id2];
                    if (p1.c === p2.c && p1.r - 1 === p2.r) topMatch = true;
                    if (p1.c === p2.c && p1.r + 1 === p2.r) bottomMatch = true;
                    if (p1.r === p2.r && p1.c - 1 === p2.c) leftMatch = true;
                    if (p1.r === p2.r && p1.c + 1 === p2.c) rightMatch = true;
                });

                p1.el.style.outline = "none";
                p1.el.style.borderTop = topMatch ? "none" : "1px solid rgba(255,255,255,0.2)";
                p1.el.style.borderBottom = bottomMatch ? "none" : "1px solid rgba(255,255,255,0.2)";
                p1.el.style.borderLeft = leftMatch ? "none" : "1px solid rgba(255,255,255,0.2)";
                p1.el.style.borderRight = rightMatch ? "none" : "1px solid rgba(255,255,255,0.2)";
            });
        }

        function startTimer() {
            stopTimer();
            state.startTime = Date.now();
            state.timerInterval = setInterval(() => {
                const diff = Date.now() - state.startTime;
                const mins = Math.floor(diff / 60000).toString().padStart(2, '0');
                const secs = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                document.getElementById('txt-time').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            if(state.timerInterval) clearInterval(state.timerInterval);
        }
    </script>
</body>
</html>
